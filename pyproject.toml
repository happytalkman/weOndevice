[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "weondevice"
version = "0.1.0"
description = "My Own On-Device AI: Stanford OpenJarvis + happytalkman/ripgrep with Intelligence-Per-Watt telemetry"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.30",
    "pydantic>=2.0",
    "httpx>=0.27",
    "rank-bm25>=0.2.2",
    "psutil>=5.9",
    "rich>=13",
    "click>=8",
    "mcp>=1.0",
]

[project.scripts]
weondevice = "weondevice.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/weondevice"]
